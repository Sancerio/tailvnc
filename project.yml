name: TailVNC
options:
  bundleIdPrefix: com.sancerio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "6"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FZZ26XMXRC
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TailVNC:
    type: application
    platform: iOS
    sources:
      - path: TailVNC
    info:
      path: TailVNC/Info.plist
      properties:
        CFBundleDisplayName: TailVNC
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: TailVNC connects directly to computers on your private network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.sancerio.tailvnc
        PRODUCT_NAME: TailVNC
        TARGETED_DEVICE_FAMILY: "1,2"
  TailVNCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TailVNCTests
    dependencies:
      - target: TailVNC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sancerio.tailvnc.tests
        GENERATE_INFOPLIST_FILE: YES
  TailVNCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TailVNCUITests
    dependencies:
      - target: TailVNC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sancerio.tailvnc.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TailVNC:
    build:
      targets:
        TailVNC: all
        TailVNCTests: [test]
        TailVNCUITests: [test]
    test:
      targets:
        - TailVNCTests
        - TailVNCUITests
