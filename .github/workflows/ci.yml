name: iOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$simulator_id"
          test "$simulator_id" != "null"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run unit, protocol integration, and UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project TailVNC.xcodeproj \
            -scheme TailVNC \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
